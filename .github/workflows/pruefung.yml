# Prüfung bei jedem Push auf main (z. B. Speichern im CMS): pruefen, build und Lighthouse.
# Veröffentlicht wird unabhängig davon durch Netlify bei jedem Push, wie gewohnt. Dieser Lauf ist eine
# Kontrolle: Bei Rot schickt GitHub eine E-Mail an die Person, die gespeichert hat, und an den Webmaster.
# Von Hand starten: "Actions > Prüfung > Run workflow". Dokumentation: docs/18-pruefung-github-actions.md
name: Prüfung

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pruefung-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruefung:
    name: Prüfen, bauen, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Wie produktiv, damit Lighthouse die freigegebene Seite misst (robots, Canonical)
      SITE_URL: https://www.lwl-techniker.ch
      SITE_INDEXABLE: 'true'
      CONTEXT: production
    steps:
      - name: Quelltext holen (ganze Historie für die Änderungsdaten der Inhalte)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prüfen (Konfiguration, Texte, Bilder, TypeScript, ESLint, Tests)
        run: npm run pruefen

      - name: Bauen
        run: npm run build

      - name: Lighthouse (Barrierefreiheit, Best Practices, SEO müssen 100 sein)
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Lighthouse-Berichte ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
